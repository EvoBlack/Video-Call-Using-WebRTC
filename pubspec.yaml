name: flutter_webrtc_healthcare
description: A healthcare video calling app using WebRTC and Firebase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # WebRTC
  flutter_webrtc: ^1.2.1
  
  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_database: ^12.1.0
  cloud_firestore: ^6.1.0
  
  # Socket.IO for signaling
  socket_io_client: ^2.0.3+1
  
  # State Management & Utils
  provider: ^6.1.2
  uuid: ^4.5.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
